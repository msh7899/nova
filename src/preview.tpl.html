<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پیش‌نمایش رابط کاربری</title>
<style>body{margin:0;font-family:Tahoma,system-ui,sans-serif;background:#dfe3ea;color:#0f172a}
.tb{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #d5dae2;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tb button{border:1px solid #d5dae2;background:#fff;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}.tb button.on{background:#0f172a;color:#fff;border-color:#0f172a}
.tb i{width:1px;height:24px;background:#d5dae2;margin:0 4px}.hint{margin-right:auto;font-size:.8rem;color:#64748b}
.stage{display:flex;justify-content:center;padding:18px 10px}
iframe{border:0;background:#fff;border-radius:24px;box-shadow:0 20px 60px #0003;width:390px;max-width:100%;height:calc(100vh - 100px);min-height:520px;transition:width .25s}</style></head><body>
<div class="tb"><button data-p="dash">داشبورد</button><button data-p="login">ورود</button><button data-p="register">ثبت‌نام</button><button data-p="portal">صفحه هات‌اسپات دستگاه</button><i></i>
<button data-w="390">موبایل</button><button data-w="1080">دسکتاپ</button><i></i><button data-t="light">روشن</button><button data-t="dark">تیره</button>
<span class="hint">داده‌ها نمونه‌اند؛ دکمه‌ها و زمان‌بندی‌ها واقعا کار می‌کنند.</span></div>
<div class="stage"><iframe id="f"></iframe></div>
<script>
const P=__PAGES__,MOCK=__MOCK__,f=document.getElementById('f');let cur='dash',theme='';
function load(){f.srcdoc=P[cur].replace('<head>',()=>'<head><script>'+MOCK+'<\/script>')}
f.onload=()=>{try{if(theme)f.contentDocument.documentElement.dataset.theme=theme}catch(e){}};
function mark(){document.querySelectorAll('.tb button').forEach(b=>b.classList.toggle('on',b.dataset.p==cur||(b.dataset.w&&f.style.width==b.dataset.w+'px')||b.dataset.t==theme))}
document.querySelectorAll('.tb button').forEach(b=>b.onclick=()=>{
 if(b.dataset.p){cur=b.dataset.p;load();if(cur=='portal'&&f.style.width!='390px')f.style.width='390px'}
 if(b.dataset.w)f.style.width=b.dataset.w+'px';
 if(b.dataset.t){theme=b.dataset.t;try{f.contentDocument.documentElement.dataset.theme=theme}catch(e){}}
 mark()});
f.style.width='390px';load();mark();
</script></body></html>
